name: Autonomous YouTube Pipeline

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the Short'
        required: false
        type: string
  schedule:
    - cron: '15 */5 * * *'

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Fonts, and Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts google-api-python-client google-auth google-auth-oauthlib

      - name: Run Shorts Pipeline and Schedule Next-Day Upload
        env:
          INPUT_TOPIC: ${{ github.event.issue.title || github.event.inputs.topic || '' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python cloud_runner.py

      - name: Save Checkpoint and Last Scheduled Date
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline-state.json output.mp4 voiceover.mp3 || true
          git diff --staged --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git push
